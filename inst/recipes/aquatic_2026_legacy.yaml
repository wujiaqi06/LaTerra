      identity: "marine_mammal_paper.NC_revise.pdf"
      sha256: "90e79077fe1472eefb5efdb41cdfcc034c69e31fdd7f3a46dbc79fbbd2b72a4b"
      governs: "what the manuscript claims was done"
    - role: "executable_reference"
      identity: "MarineMammal_NC_software_submission_v1.2_20260807_102310.zip"
      sha256: "3f734be2a1777c39f3a1c5a0a86c7690eaf0e474d7d3fe06c128a455e3aea80e"
      governs: "editor/reviewer-stage executable reference, environment, smoke tests, and manifest"
    - role: "data_result"
