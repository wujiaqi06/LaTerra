schema_version: "1.1.0"
recipe_id: "aquatic_2026_legacy"
description: >-
  Non-executing reference configuration for the frozen binary
  aquatic-dependence analysis. Semi-aquatic taxa remain an explicit excluded
  endpoint category and are not silently recoded.
execution:
  enabled: false
  scientific_algorithms_implemented: false
  stop_reason: "LT001-A1A hardens architecture only"
