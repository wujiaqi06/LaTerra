    recompute_coordinates: false
trait:
  input:
    path: "Dryad_ready_data/00_traits_and_species/trait_table.mammal302.active_TY_NK_final_18pt.tsv"
    sha256: "b7b04906d074bb2bd8f82b5b646fcd76b1b880e566ef6cb8a0cf0ef54ed0ccd2"
    format: "tsv"
  trait_id: "binary_aquatic_dependence"
  taxon_id_column: "species"
  value_column: "aquatic_v2"
  type: "binary"
  coding:
    positive: 1
    background: 0
    excluded_intermediate: 0.5
    expected_positive_taxa: 63
    expected_background_taxa: 226
    expected_excluded_taxa: 13
domain:
  observation_level: "terminal_taxa"
  eligible_values: [0, 1]
  excluded_values: [0.5]
  grouping:
    unit: "genus"
    derivation: "first underscore-delimited token of species identifier"
rate:
  enabled: true
  method: "legacy_gbi_ratio"
  contract_version: "aquatic_2026_legacy_gbi/1.0.0"
  parameters:
    rate_id: "aquatic_2026_legacy_gbi"
    trait_independent: true
    input_scale: "fixed-topology coordinate-valid branch lengths"
    output_scale: "GBI = trimmed length / (branch effect * gene effect)"
    within_gene_upper_tail_quantile: 0.975
    trim_rule: "values at or above quantile become missing"
    branch_effect: "arithmetic mean of non-missing trimmed values by branch"
    gene_effect: "arithmetic mean of non-missing trimmed values by gene"
    non_finite_output: "missing"
branch_state:
  enabled: true
  method: "deterministic_maximum_parsimony"
  contract_version: "aquatic_2026_legacy_branch_state/1.0.0"
  parameters:
    implementation: "castor::asr_max_parsimony"
    ties:
      method: "first"
      state_order: [0, 0.5, 1]
    mapping: "descendant-node state assigned to each branch"
    main_scope: "global frozen annotation; 114 positive, 474 background, 13 intermediate branches"
    sensitivity:
      foldwise_enabled: true
      implementation: "castor::hsp_max_parsimony"
      held_out_terminal_labels: "masked before ASR"
screen:
  enabled: true
  method: "welch_two_sample_t_test"
  contract_version: "aquatic_2026_legacy_screen/1.0.0"
  parameters:
    sidedness: "two-sided"
    missing_values: "gene-wise available finite values; no imputation"
    minimum_group_size: 2
    direction: "background mean minus trait mean; positive is slow"
    fdr:
      method: "sorted Benjamini-Hochberg legacy rule"
      alpha: 0.01
      comparison: "p_sorted[k] < k / m * alpha"
      selection: "advance from rank 1 while the strict inequality holds; retain the passing prefix"
    nested_behavior:
      global_screen: "exclude 13 intermediate branches; use 588 branches"
      outer_fold_screen: "remove held-out-genus terminal branches; retain eligible internal branches"
preprocess:
  enabled: true
  method: "foldwise_gene_mean_center_scale"
  contract_version: "aquatic_2026_legacy_preprocess/1.0.0"
  parameters:
    sample_level: "eligible terminal species only; exclude value 0.5 throughout"
    imputation:
      method: "gene mean"
      learned_from: "eligible training terminal species only within folds"
      interpretation: "numeric placeholder, not a branch-rate estimate"
    scaling:
      method: "manual center and scale"
      learned_from: "eligible training terminal species only within folds"
    feature_exclusion: ["all missing in training", "zero variance in training"]
validation:
  enabled: true
  method: "nested_genus_leave_one_out"
  contract_version: "aquatic_2026_legacy_validation/1.0.0"
  parameters:
    outer_resampling:
      method: "genus-level leave-one-out"
      test_unit: "all eligible terminal species in one genus"
    nesting:
      supervised_feature_selection: true
      imputation_scaling_lambda_model: true
      gbi_construction: false
      frozen_main_asr: true
    held_out_handling:
      terminal_branches_removed_from_screen: true
      internal_branches_retained_in_screen: true
    metric:
      name: "rank-based AUC"
      ties: "average ranks"
      pooling: "finite out-of-fold predictions from 289 eligible taxa"
model:
  enabled: true
  method: "lasso_binomial"
  contract_version: "aquatic_2026_legacy_model/1.0.0"
  parameters:
    engine: "glmnet"
    family: "binomial"
    penalty: "LASSO"
    alpha: 1.0
    lambda_selection:
      engine: "cv.glmnet"
      choice: "lambda.min"
      type_measure: "deviance"
      inner_folds: "one training terminal species per fold"
    standardize: false
null_model:
  - enabled: false
    method: "positive_count_permutation"
    contract_version: "aquatic_2026_legacy_positive_count_null/1.0.0"
    parameters:
      reason: "not part of the aquatic_2026_legacy baseline evidence"
  - enabled: true
    method: "predictor_turnover"
    contract_version: "aquatic_2026_legacy_predictor_turnover/1.0.0"
    parameters:
      target_comparison: "aquatic baseline versus no Cetacea"
      permutations: 10000
      gene_universe: "union of comparison-specific full-data candidate genes"
      module_universe: "module-annotated subset of candidate-gene union"
      metrics: ["gene Jaccard", "module-presence Jaccard", "module-count cosine"]
      empirical_p: "upper tail with +1 correction"
outputs:
  root: "REQUIRED_WRITABLE_OUTPUT_ROOT/aquatic_2026_legacy"
  formats: ["tsv", "rds", "yaml"]
  required_provenance:
    - input_sha256
    - configuration_sha256
    - software_version
    - environment
    - ordered_gene_ledger
    - ordered_branch_ledger
    - taxon_domain_ledger
    - eligibility_masks
    - specification_ledger
    - filter_ledger
    - seed_ledger
    - fold_ledger
    - commands
    - output_hashes
