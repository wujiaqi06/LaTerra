    format: "archive_member"
    member: "fix_17434.matrix_no_fuse.oldlabels.txt"
    member_sha256: "3ec73fa19d2706d6ff86f397e1235f1303f6364f7cfb422189d0bd3917551a7e"
    gene_axis: "rows"
    branch_axis: "columns"
    gene_id_column: "Gene"
  payload:
    type: "branch_length"
    name: "fixed_topology_gene_tree_branch_length"
    units: "substitutions_per_site"
    scale: "linear_nonnegative"
    origin: "imported"
    spec_id: null
  coord_state:
    mode: "separate_input"
    input:
      path: "Dryad_ready_data/17_large_matrix_archives/branch_coordinate_matrices.tar.gz"
      sha256: "1dcc4bdbec568c3e02a17077a528ecc40ecfe1598c98de23195d215b4e046552"
      format: "archive_member"
      member: "17434.fix.na_classified.oldlabels.txt"
      member_sha256: "d83b1bbb4f4ae124bd4e385f52ccd681c0ef9d1094464f7517753af1b3d00685"
