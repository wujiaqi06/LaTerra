$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://laterra.example/schema/lt_recipe-1.1.0"
title: "La Terra recipe schema"
description: >-
  Machine-readable interoperability contract for LT001-A1A. R-native semantic
  validation is authoritative for V1. A conforming recipe describes inputs,
  extensible scientific method modules, outputs, and audit requirements but
  does not authorize execution or certify a scientific result.
type: object
additionalProperties: false
required:
  - schema_version
  - recipe_id
  - execution
  - matrix
  - trait
  - domain
  - rate
  - branch_state
  - screen
  - preprocess
  - validation
  - model
  - outputs
properties:
  schema_version:
    type: string
    const: "1.1.0"
  recipe_id:
    type: string
    minLength: 1
  description:
    type: string
  execution:
    type: object
    additionalProperties: false
    required: [enabled, scientific_algorithms_implemented]
    properties:
      enabled: {type: boolean}
      scientific_algorithms_implemented: {type: boolean}
      stop_reason: {type: string}
  authority:
    $ref: "#/$defs/authority_set"
  matrix:
    type: object
    additionalProperties: false
    required: [input, payload, coord_state, value_reason, coordinate_provenance]
    properties:
      input:
        $ref: "#/$defs/matrix_input"
      payload:
        $ref: "#/$defs/payload"
      coord_state:
        $ref: "#/$defs/coord_state_source"
      value_reason:
        $ref: "#/$defs/value_reason_source"
      coordinate_provenance:
        $ref: "#/$defs/coordinate_provenance"
  trait:
    type: object
    additionalProperties: false
    required: [input, trait_id, taxon_id_column, value_column, type, coding]
    properties:
      input: {$ref: "#/$defs/file_input"}
      trait_id: {type: string, minLength: 1}
      taxon_id_column: {type: string, minLength: 1}
      value_column: {type: string, minLength: 1}
      type: {enum: [binary, categorical, ordinal, continuous]}
      coding:
        type: object
        minProperties: 1
  domain:
    type: object
    additionalProperties: false
    required: [observation_level, eligible_values, excluded_values, grouping]
    properties:
      observation_level: {enum: [terminal_taxa, branches, custom]}
      eligible_values: {type: array}
      excluded_values: {type: array}
      grouping:
        type: object
        additionalProperties: false
        required: [unit, derivation]
        properties:
          unit: {type: string, minLength: 1}
          derivation: {type: string, minLength: 1}
  rate:
    allOf:
      - {$ref: "#/$defs/method_module"}
      - description: "Current recipes must not request historical finite logGBI; use GBI then lt_log_relative, or an explicit replay workflow."
        not:
          properties:
            method: {const: logGBI}
          required: [method]
  branch_state: {$ref: "#/$defs/method_module"}
  screen: {$ref: "#/$defs/method_module"}
  preprocess: {$ref: "#/$defs/method_module"}
  validation: {$ref: "#/$defs/method_module"}
  model: {$ref: "#/$defs/method_module"}
  null_model:
    type: array
    items: {$ref: "#/$defs/method_module"}
  outputs:
    type: object
    additionalProperties: false
    required: [root, formats, required_provenance]
    properties:
      root: {type: string, minLength: 1}
      formats:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [tsv, csv, rds, yaml, json, pdf, png]}
      required_provenance:
        type: array
        minItems: 14
        uniqueItems: true
        items:
          enum:
            - input_sha256
            - configuration_sha256
            - software_version
            - environment
            - ordered_gene_ledger
            - ordered_branch_ledger
            - taxon_domain_ledger
            - eligibility_masks
            - specification_ledger
            - filter_ledger
            - seed_ledger
            - fold_ledger
            - commands
            - output_hashes
$defs:
  sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  nullable_sha256:
    oneOf:
      - type: string
        pattern: "^[0-9a-f]{64}$"
      - type: "null"
  file_input:
    type: object
    additionalProperties: false
    required: [path, sha256, format]
    properties:
      path: {type: string, minLength: 1}
      sha256: {$ref: "#/$defs/nullable_sha256"}
      format: {enum: [tsv, csv, rds, archive_member]}
      member: {type: string, minLength: 1}
      member_sha256: {$ref: "#/$defs/nullable_sha256"}
    allOf:
      - if:
          properties:
            format: {const: archive_member}
          required: [format]
        then:
          required: [member, member_sha256]
        else:
          not:
            anyOf:
              - required: [member]
              - required: [member_sha256]
  matrix_input:
    type: object
    additionalProperties: false
    required: [path, sha256, format, gene_axis, branch_axis, gene_id_column]
    properties:
      path: {type: string, minLength: 1}
      sha256: {$ref: "#/$defs/nullable_sha256"}
      format: {enum: [tsv, csv, rds, archive_member]}
      member: {type: string, minLength: 1}
      member_sha256: {$ref: "#/$defs/nullable_sha256"}
      gene_axis: {type: string, const: rows}
      branch_axis: {type: string, const: columns}
      gene_id_column: {type: string, minLength: 1}
    allOf:
      - if:
          properties:
            format: {const: archive_member}
          required: [format]
        then:
          required: [member, member_sha256]
        else:
          not:
            anyOf:
              - required: [member]
              - required: [member_sha256]
  payload:
    type: object
    additionalProperties: false
    required: [type, name, units, scale, origin, spec_id]
    properties:
      type: {type: string, minLength: 1}
      name: {type: string, minLength: 1}
      units: {type: string, minLength: 1}
      scale: {type: string, minLength: 1}
      origin: {enum: [imported, derived]}
      spec_id:
        oneOf:
          - type: string
            minLength: 1
          - type: "null"
    allOf:
      - if:
          properties:
            origin: {const: derived}
          required: [origin]
        then:
          properties:
            spec_id: {type: string, minLength: 1}
  coord_state_source:
    type: object
    additionalProperties: false
    required: [mode, allowed_states, numeric_zero_is_observed]
    properties:
      mode: {enum: [all_observed, separate_input]}
      input: {$ref: "#/$defs/file_input"}
      allowed_states:
        type: array
        uniqueItems: true
        minItems: 5
        maxItems: 5
        items:
          enum: [observed, NA_struct, NA_fuse, NA_topo, residual_NA]
      numeric_zero_is_observed: {type: boolean, const: true}
    allOf:
      - if:
          properties:
            mode: {const: separate_input}
          required: [mode]
        then:
          required: [input]
        else:
          not:
            required: [input]
  value_reason_source:
    type: object
    additionalProperties: false
    required: [mode]
    properties:
      mode: {enum: [none, separate_input]}
      input: {$ref: "#/$defs/file_input"}
    allOf:
      - if:
          properties:
            mode: {const: separate_input}
          required: [mode]
        then:
          required: [input]
        else:
          not:
            required: [input]
  coordinate_provenance:
    type: object
    additionalProperties: false
    required:
      - coordinate_system
      - reference_tree_sha256
      - ordered_branch_ledger_sha256
      - ordered_taxon_ledger_sha256
      - branch_label_contract
      - source_method
    properties:
      coordinate_system: {type: string, minLength: 1}
      reference_tree_path: {type: string, minLength: 1}
      reference_tree_sha256: {$ref: "#/$defs/sha256"}
      ordered_branch_ledger_sha256: {$ref: "#/$defs/sha256"}
      ordered_taxon_ledger_sha256: {$ref: "#/$defs/sha256"}
      ledger_hash_canonicalization: {type: string, minLength: 1}
      branch_label_contract: {type: string, minLength: 1}
      source_method: {type: string, minLength: 1}
      source_software: {type: string, minLength: 1}
      source_version: {type: string, minLength: 1}
      source_commit: {type: string, minLength: 1}
      mapping_artifact: {$ref: "#/$defs/file_input"}
      already_mapped: {type: boolean}
      recompute_coordinates: {type: boolean, const: false}
  method_module:
    type: object
    additionalProperties: false
    required: [enabled, method, contract_version, parameters]
    properties:
      enabled: {type: boolean}
      method: {type: string, minLength: 1}
      contract_version: {type: string, minLength: 1}
      parameters: {type: object}
  authority_set:
    type: object
    additionalProperties: false
    required: [contract_version, records]
    properties:
      contract_version: {type: string, minLength: 1}
      records:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [role, identity, governs]
          properties:
            role:
              enum:
                - scientific_specification
                - executable_reference
                - data_result
                - source_code_identity
            identity: {type: string, minLength: 1}
            sha256: {$ref: "#/$defs/nullable_sha256"}
            tag: {type: string, minLength: 1}
            tag_object: {type: string, pattern: "^[0-9a-f]{40}$"}
            peeled_commit: {type: string, pattern: "^[0-9a-f]{40}$"}
            governs: {type: string, minLength: 1}
